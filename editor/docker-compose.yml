version: "3.8"

services:
  editor:
    build:
      context: .
      args:
        # BUILD-TIME ONLY. next.config.js lists TEST_MODE in its `env` block,
        # which Next inlines into the bundle during `next build`. Setting it
        # under `environment:` below would have no effect whatsoever.
        - TEST_MODE=${TEST_MODE:-false}
    restart: always
    expose:
      - "3000"
    environment:
      # Public URL this app is served from. NextAuth derives its OAuth
      # callback URL from it, so it must match the redirect URI registered
      # in the Google Cloud console: <NEXTAUTH_URL>/api/auth/callback/google
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # Cookie/JWT encryption key -- generate with: openssl rand -base64 32
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

      # Google Sign-In. GOOGLE_CLIENT_ID must be the SAME value the backend
      # verifies against, since it is the `aud` of the ID tokens we forward.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # Backend base URL used by the /api/* proxy route.
      # NOTE: src/pages/api/[...proxy].ts strips the leading `/api` from the
      # incoming path, while the backend mounts every route under `/api`, so
      # this value must END WITH `/api` -- eg. http://backend:5000/api
      - BACK_URL=${BACK_URL}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/providers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
