services:
  game-api:
    build: .
    restart: always
    expose:
      # Hardcoded in index.js -- the app does not read a PORT variable
      - "3000"
    environment:
      # Database connection (Will be set to the Coolify Internal MongoDB URL).
      # config/db.js exits the process if this is wrong, so a bad value shows
      # up as a crash loop rather than a running-but-broken container.
      - MONGO_URI=${MONGO_URI}

      # Auth. Without JWT_EXPIRES_IN the signed tokens never expire.
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}

      # Polyglot backend, used server-side by GET /percorsi to fetch the flow
      # catalogue. No trailing slash. POLYGLOT_SERVICE_TOKEN must equal the
      # backend's SERVICE_TOKEN.
      - POLYGLOT_API_URL=${POLYGLOT_API_URL}
      - POLYGLOT_SERVICE_TOKEN=${POLYGLOT_SERVICE_TOKEN}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
