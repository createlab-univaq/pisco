services:
  dashboard:
    build:
      context: .
      args:
        # BUILD-TIME ONLY. flutter_dotenv reads .env out of the compiled web
        # bundle, so this value is frozen when the image is built. Setting it
        # under `environment:` would have no effect.
        # NOTE: the bundled .env is served publicly at /assets/.env -- never
        # put a secret in it.
        - API_URL=${API_URL}
    restart: always
    expose:
      # nginx-unprivileged cannot bind privileged ports
      - "8080"

    healthcheck:
      # 127.0.0.1, not localhost: that resolves to ::1 first in this image and
      # nginx-unprivileged only listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
