server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Flutter web output is NOT content-hashed: index.html, flutter_bootstrap.js,
    # main.dart.js and assets/ keep the same filenames on every build. Without
    # this, a browser happily serves the previous deploy from disk cache.
    #
    # "no-cache" does not mean "do not cache" -- it means revalidate every time.
    # nginx answers with a 304 from its ETag when nothing changed, so repeat
    # loads stay cheap while a new deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
