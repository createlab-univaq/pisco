version: "3.8"

services:
  backend:
    build: .
    restart: always
    expose:
      - "5000"
    environment:
      # Database connection (Will be set to the Coolify Internal MongoDB URL)
      - MONGODB_URI=${MONGODB_URI}
      # Optional: PEM contents of a Mongo TLS client certificate
      - MONGODB_CERTIFICATE=${MONGODB_CERTIFICATE}

      # App configurations
      - CORS_ORIGINS=${CORS_ORIGINS}
      - TEST_MODE=${TEST_MODE:-false}
      # Public host of THIS backend. Embedded into the `--serverurl` of the
      # generated notebooks, so it must be the externally reachable domain
      # (falls back to localhost:5000, which breaks those links).
      - DOMAIN_APP_DEPLOY=${DOMAIN_APP_DEPLOY}
      
      # Auth & AI Services
      - OPENAI_SECRET_KEY=${OPENAI_SECRET_KEY}
      - OPENAI_ENDPOINT=${OPENAI_ENDPOINT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # Shared secret for trusted server-to-server callers (game-api's
      # GET /percorsi). Must match game-api's POLYGLOT_SERVICE_TOKEN.
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      
      # S3 / MinIO configurations (Will be set to the Coolify Internal MinIO details)
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
    
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s