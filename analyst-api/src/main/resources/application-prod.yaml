# Production. Every value comes from the environment, which docker-compose loads
# from an untracked .env (see .env.example). No defaults on the secrets: a missing
# JWT_SECRET or DB_PASSWORD must stop startup, not silently fall back to something weak.

spring:
  jpa:
    hibernate:
      # Hibernate adds tables and columns but never drops or retypes them.
      ddl-auto: update
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expires-in: ${JWT_EXPIRES_IN:PT8H}

logging:
  level:
    pisco.analystapi: INFO
